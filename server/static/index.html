<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Efficient Times Tables Practice</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Auth view -->
  <div id="auth-view" class="view">
    <h1>Efficient Times Tables Practice</h1>
    <div class="card">
      <div class="role-tabs" id="role-tabs">
        <button class="role-tab active" data-role="student">Student</button>
        <button class="role-tab" data-role="teacher">Teacher</button>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="none" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <div class="auth-buttons">
        <button id="login-btn" class="btn-primary">Log in</button>
        <button id="register-btn" class="btn-secondary">Register</button>
      </div>
      <div id="google-auth" class="hidden">
        <div class="divider">or</div>
        <button id="google-btn" class="btn-google">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18" style="vertical-align:middle;margin-right:8px;">
            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.09-6.09C34.46 3.1 29.5 1 24 1 14.82 1 7.07 6.48 3.69 14.09l7.1 5.52C12.5 13.48 17.77 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.7c-.55 2.96-2.2 5.47-4.68 7.16l7.18 5.58C43.36 37.26 46.52 31.36 46.52 24.5z"/>
            <path fill="#FBBC05" d="M10.79 28.39A14.6 14.6 0 0 1 9.5 24c0-1.52.26-3 .71-4.39l-7.1-5.52A23.93 23.93 0 0 0 0 24c0 3.86.92 7.5 2.55 10.72l8.24-6.33z"/>
            <path fill="#34A853" d="M24 47c5.5 0 10.12-1.82 13.5-4.93l-7.18-5.58C28.6 37.88 26.42 38.5 24 38.5c-6.23 0-11.5-4-13.21-9.39l-8.24 6.33C6.07 43.52 14.38 47 24 47z"/>
          </svg>
          Sign in with Google
        </button>
      </div>
      <p id="auth-error" class="error-msg hidden"></p>
    </div>
  </div>

  <!-- Practice view -->
  <div id="practice-view" class="view hidden">
    <h1>Efficient Times Tables Practice</h1>
    <div class="practice-layout">

      <!-- Left: problem + stats + actions -->
      <div class="practice-left">
        <div class="card problem-card">
          <div id="problem-text" class="problem-text">7 × 8 = ?</div>

          <!-- Normal answer mode -->
          <div id="normal-mode">
            <input
              type="number"
              id="answer-input"
              class="answer-input"
              inputmode="numeric"
              placeholder="?"
              autocomplete="off"
            />
            <button id="submit-btn" class="btn-primary">Submit</button>
          </div>

          <!-- Correction mode -->
          <div id="correction-mode" class="hidden">
            <p id="incorrect-msg" class="error-msg"></p>
            <input
              type="number"
              id="correction-input"
              class="answer-input"
              inputmode="numeric"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Actions -->
        <div class="actions">
          <div id="reset-area">
            <button id="reset-btn" class="btn-danger-outline">Reset progress</button>
            <div id="reset-confirm" class="hidden confirm-row">
              <span>Reset all progress?</span>
              <button id="reset-yes" class="btn-danger">Yes, reset</button>
              <button id="reset-cancel" class="btn-secondary">Cancel</button>
            </div>
          </div>
          <button id="logout-btn" class="btn-ghost">Log out</button>
        </div>
      </div>

      <!-- Right: table progress rows + grid -->
      <div class="practice-right">
        <div class="card grid-card">
          <div class="grid-title">Tables</div>
          <div id="table-rows" class="table-rows"></div>
          <div class="grid-title grid-title-sub">Progress</div>
          <div id="progress-grid" class="progress-grid"></div>
          <div class="grid-legend">
            <span class="legend-item" data-tooltip="Haven't answered this problem yet"><span class="legend-dot not_started"></span>Not started</span>
            <span class="legend-item" data-tooltip="Got it right at least once"><span class="legend-dot learning"></span>Learning</span>
            <span class="legend-item" data-tooltip="3 correct answers in a row"><span class="legend-dot solid"></span>Solid</span>
            <span class="legend-item" data-tooltip="Solid + answered in under 3s at least once"><span class="legend-dot fast"></span>Fast</span>
            <span class="legend-item" data-tooltip="3 correct answers in a row, each under 3s"><span class="legend-dot mastered"></span>Mastered</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Teacher view -->
  <div id="teacher-view" class="view hidden">
    <h1>Teacher Dashboard</h1>
    <div class="card teacher-invite-card">
      <div class="teacher-section-title">Invite Students</div>
      <div id="invite-url-row" class="invite-url-row">
        <span id="invite-url" class="invite-url"></span>
        <button id="copy-invite-btn" class="btn-secondary copy-btn">Copy</button>
      </div>
      <div id="qr-container" class="qr-container"></div>
    </div>
    <div class="card teacher-students-card">
      <div class="teacher-section-title">My Students</div>
      <div id="student-list" class="student-list"></div>
      <p id="no-students-msg" class="no-students-msg hidden">No students yet. Share the invite link above.</p>
    </div>
    <div class="teacher-actions">
      <button id="teacher-logout-btn" class="btn-ghost">Log out</button>
    </div>
  </div>

  <!-- OAuth role-choice modal -->
  <div id="oauth-choice-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="oauth-choice-msg"></p>
      <div class="modal-actions">
        <button id="oauth-create-new" class="btn-primary"></button>
        <button id="oauth-use-existing" class="btn-secondary"></button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
